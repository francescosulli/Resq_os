    - TRIANGULAR_BANDAGE
    fallback:
    - FIXATION_BANDAGE_FB6
    - FIXATION_BANDAGE_FB8
    selection_policy: contextual_first_available
  THERMAL_BLANKET:
    preferred:
    - THERMAL_BLANKET
    selection_policy: single
  CUT_OR_EXPOSE:
    preferred:
    - SCISSORS_FIRST_AID
    selection_policy: single
  DRESSING_FIXATION:
    preferred:
    - ADHESIVE_TAPE_ROLL
    fallback:
    - FIXATION_BANDAGE_FB6
    - FIXATION_BANDAGE_FB8
    selection_policy: first_available
  LARGE_WOUND_COVER:
    preferred:
    - STERILE_DRAPE_60X80
    fallback:
    - DRESSING_M_C2
    selection_policy: first_available
  AMPUTATED_PART_CONTAINER:
    preferred:
    - RESEALABLE_BAG
    selection_policy: quantity_required_2_if_available
inventory_rules:
  during_emergency: mark resolved physical SKU as PENDING_USE; do not decrement yet
  post_event: allow per-SKU and per-quantity correction before confirm
  after_confirm: decrement confirmed quantities and recompute readiness
  sync: persist locally first; sync non-blocking to ResQ Connect
  readiness_states:
  - READY
  - MAINTENANCE
  - REFILL_REQUIRED
  - NON_OPERATIONAL
