material_requests:
  PPE_GLOVES:
    preferred:
    - GLOVES_NITRILE
    selection_policy: single
  CPR_FACE_SHIELD:
    preferred:
    - CPR_FACE_SHIELD
    selection_policy: single
  MAJOR_BLEED_DRESSING:
    preferred:
    - DRESSING_G
    fallback:
    - DRESSING_M_C1
    - STERILE_COMPRESS_10X10_C1
    selection_policy: first_available
  BLEED_FALLBACK:
    preferred:
    - DRESSING_M_C1
    fallback:
