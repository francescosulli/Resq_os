version: '1.1'
release: ResQ Prototype Architecture 1.1 — UX & Human Factors
scope: presentation_only
inherits:
  clinical_flow: ResQ_flow_nodes_v1_2.json
  state_machine: ResQ_state_machine_spec_v1_2.yaml
  automotive_bom: ResQ_Automotive_BOM_v1_0.yaml
authority_rule: This UX specification may change rendering, display labels, control positions and service presentation, but MUST NOT change clinical targets, prompts, MaterialRequests, BOM quantities or clinical semantics.
states:
  EM_START:
    state_type: action
    primary_controls:
      left:
        display_label: ESCI
        semantic_event: EV_CLOSE_SESSION
        source_button_label: ESCI
        color_role: neutral
        icon: exit
        touch_enabled: true
        physical_enabled: true
      right:
        display_label: INIZIA
        semantic_event: EV_START_EMERGENCY
        source_button_label: INIZIA
        color_role: success
        icon: choice
        touch_enabled: true
        physical_enabled: true
    active_primary_count: 2
    repeat_mode: none
    call112_presentation: hidden_unless_service_call_already_active
    call112_policy_from_flow: null
    cpr_metronome: 'off'
    material_led_zone_from_flow: null
    notes: []
    screen_mode: ACTION
  SCENE_SAFE:
    state_type: decision
    primary_controls:
      left:
        display_label: 'NO'
        semantic_event: EV_NO
        source_button_label: 'NO'
        color_role: danger
        icon: x
        touch_enabled: true
        physical_enabled: true
      center:
        display_label: NON SO
        semantic_event: EV_UNKNOWN
        source_button_label: NON SO
        color_role: warning
        icon: help
        touch_enabled: true
        physical_enabled: true
      right:
        display_label: SÌ
        semantic_event: EV_YES
        source_button_label: SÌ
        color_role: danger
        icon: check
        touch_enabled: true
        physical_enabled: true
    active_primary_count: 3
    repeat_mode: header_touch
    call112_presentation: hidden_unless_service_call_already_active
    call112_policy_from_flow: null
    cpr_metronome: 'off'
    material_led_zone_from_flow: null
    notes:
    - RIPETI stays available as a separate utility and does not consume a primary physical lane.
    screen_mode: EVALUATION
