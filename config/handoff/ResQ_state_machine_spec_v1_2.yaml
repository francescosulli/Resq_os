version: '1.2'
architecture: hierarchical_state_machine_plus_event_driven_services
top_level_states:
  BOOT:
  - SELF_TEST
  - READY
  - DEGRADED
  - FAULT_CRITICAL
  IDLE:
  - HOME
  - MAINTENANCE
  - APP_SYNC
  EMERGENCY:
    initial: INIT_SESSION
    clinical_substates:
    - SCENE_SAFETY
    - MULTI_CASUALTY
    - LIFE_THREATS
    - UNRESPONSIVE_BLS
    - RESPONSIVE_ABCDE
    - MONITORING
    - HANDOVER
  POST_EVENT:
  - INVENTORY_REVIEW
  - SYNC_PENDING
  - COMPLETE
orthogonal_services:
  Call112Service:
    states:
    - IDLE
    - RECOMMENDED
    - USER_CALLING
    - OPERATOR_PRIORITY
    - RETURN_TO_FLOW
    principle: never autonomously places the call in prototype
  MaterialService:
    states:
    - IDLE
    - REQUESTED
    - LED_ON
    - MEDIA_SHOWN
    - WAIT_CONFIRM
    - FOUND
    - FALLBACK
    - UNAVAILABLE
    inputs:
    - MaterialRequest
    outputs:
    - LEDCommand
    - UIAsset
    - InventoryPendingUse
    source_of_truth: ResQ_Automotive_BOM_v1_0.yaml
    rule: Resolve semantic MaterialRequest to physical SKU, then zone/slot/LED. Exhaust
      BOM fallback SKUs before emitting EV_MATERIAL_UNAVAILABLE.
    led_granularity: one zone at a time
  UIAudioService:
    states:
    - RENDERING
    - PLAYING_AUDIO
    - WAITING_INPUT
    rule: one primary action per screen; max three mapped soft-keys
  InventoryService:
    states:
    - READY
    - PENDING_USE
    - POST_EVENT_REVIEW
    - DIRTY
    - SYNC_PENDING
    - SYNCED
    sync_target: ResQ Connect
    source_of_truth: ResQ_Automotive_BOM_v1_0.yaml
    rule: Track resolved physical SKU as PENDING_USE; final decrement only after post-event
      correction/confirmation.
  AppSyncService:
    states:
    - DISCONNECTED
    - CONNECTING
    - CONNECTED
    - SYNCING
    - ERROR
    safety: must never block emergency mode
events:
- EV_AED_AVAILABLE
- EV_ABNORMAL_BREATHING
- EV_CALL112_STARTED
- EV_CLOSE_SESSION
- EV_DONE
- EV_HANDOVER
- EV_ITEM_TAKEN
- EV_MATERIAL_NOT_FOUND
- EV_MATERIAL_TAKEN
- EV_MATERIAL_UNAVAILABLE
- EV_NO
- EV_NORMAL_BREATHING
- EV_OPERATOR_ACTIVE
- EV_OPERATOR_ENDED
- EV_PROBLEM
- EV_REPEAT
- EV_RESPONSIVE
- EV_SKIP
- EV_STABLE
- EV_START_EMERGENCY
- EV_UNKNOWN
- EV_UNRESPONSIVE
- EV_WORSENING
- EV_YES
event_contracts:
  EV_AED_AVAILABLE:
    meaning: A physical AED is now available to the rescuer.
    allowed_states:
    - ADULT_CPR
    - ADULT_CPR_LOOP
    - PED_CPR
    - PED_CPR_COMP_ONLY
    target: AED_USE
    return_state_context: aed_return_state
    return_state_by_source:
      ADULT_CPR: ADULT_CPR_LOOP
      ADULT_CPR_LOOP: ADULT_CPR_LOOP
      PED_CPR: PED_CPR
      PED_CPR_COMP_ONLY: PED_CPR_COMP_ONLY
    default_return_state: ADULT_CPR_LOOP
    must_not_imply:
    - shockable_rhythm
    - shock_required
    - aed_powered_on
    - pads_attached
context:
  session_id: uuid
  current_patient: index
  patient_count: optional_int
  age_class: UNKNOWN|INFANT|CHILD|ADULT
  call112_status: enum
  operator_priority: bool
  materials_probably_used: set[material_id]
  active_material_request: optional
  active_led_zone: optional
  metronome_active: bool
  aed_present: bool
  aed_return_state: optional_state_id
  last_transition_at: timestamp
  country_profile: IT_prototype_v1_0
  kit_profile: ResQ_Automotive_BOM_v1_0
invariants:
- Emergency mode works offline.
- App sync cannot block or alter clinical transitions.
- No generative AI selects clinical transitions.
- No medicine is stocked in the ResQ kit.
- Unknown answers use a prevalidated precautionary transition.
- Operator instructions have priority when 112 call is active.
- Every material request has a predefined location and fallback policy.
- Inventory is only finalized after post-event user confirmation.
- Clinical states never reference physical SKU, slot or LED identifier.
- At most one material request and one LED zone are active in a clinical state.
- Optional materials never block or skip a required clinical action.
- Missing CPR face shield must not by itself bypass paediatric rescue breaths.
- AED_USE returns only to the CPR state declared by aed_return_state.
- ResQ never decides whether a rhythm is shockable or whether a shock is required.
- Physical material substitutions are resolved by MaterialService using BOM v1.0,
  not by clinical transitions.
